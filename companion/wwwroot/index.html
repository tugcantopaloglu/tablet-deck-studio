<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <title>Tablet Deck Studio</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/purify.min.js" defer></script>
  <script src="app.js" defer></script>
  <script src="features.js" defer></script>
  <script src="boards.js" defer></script>
  <script src="desktop.js" defer></script>
  <script src="studio.js" defer></script>
  <script src="monitor.js" defer></script>
  <script src="hardening.js" defer></script>
  <script src="latency.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>Tablet Deck</h1>
    <button id="connection" class="connection" aria-label="Connection settings"><span class="dot" id="obs-dot"></span><span id="obs-status">Connecting</span></button>
    <span id="transport" class="transport">Local control</span>
    <span id="stream-status" class="stream-status"><span class="dot"></span>Stream offline</span>
    <select id="pad-density" class="pad-density" aria-label="Buttons in full pad" hidden><option value="24">24 buttons</option><option value="40">40 buttons</option></select>
    <button id="pad-toggle" class="quiet pad-toggle" aria-pressed="false">Full pad</button>
    <button id="pair-button" class="quiet" hidden>Pair tablet</button>
    <button id="pc-setup" class="quiet" hidden>PC setup</button>
    <button id="soundpad-button" class="quiet">Soundpad</button>
    <button id="studio-tools" class="quiet">Tools</button>
    <button id="monitor-toggle" class="quiet" aria-pressed="false">Monitor</button>
    <button id="arrange-cancel" class="quiet" hidden>Cancel</button>
    <button id="edit-button" class="quiet"></button>
  </header>
  <main id="workspace" class="workspace">
    <aside id="live-monitor" class="live-monitor" aria-label="OBS preview and stream chat" hidden>
      <div class="monitor-heading"><h2>Monitor</h2><button id="monitor-settings" class="quiet">Settings</button><button id="monitor-close" class="quiet" aria-label="Close monitor">Close</button></div>
      <section id="monitor-video" class="monitor-video" aria-label="Local OBS video preview">
        <div class="row"><button id="preview-toggle" class="quiet" aria-pressed="false">Start preview</button><span id="preview-source" class="help">OBS program</span></div>
        <div class="preview-picture"><img id="preview-image" alt="Current OBS scene preview" hidden><p id="preview-empty">Start the local OBS preview when you need it.</p></div>
        <p id="preview-status" class="help" role="status">No audio · preview is off</p>
        <span id="preview-age" class="help" aria-live="off"></span>
      </section>
      <section id="monitor-chat" class="monitor-chat" aria-label="Twitch and Kick chat preview">
        <div class="chat-tabs"><button id="chat-twitch" class="quiet" aria-pressed="true">Twitch</button><button id="chat-kick" class="quiet" aria-pressed="false">Kick</button></div>
        <div class="row"><button id="chat-load" class="quiet">Load chat</button><button id="chat-popout" class="quiet" hidden>Open chat window</button></div>
        <div id="chat-viewport" class="chat-viewport"><p id="chat-empty">Add editable channel names in Monitor settings.</p></div>
        <p id="chat-status" class="help" role="status">Chat is off · loading contacts the selected provider</p>
      </section>
    </aside>
    <section class="keys-area" aria-label="Action buttons"><div id="keys" class="keys"></div><div id="pagination" class="pagination" hidden></div></section>
    <aside class="mixer" aria-label="OBS audio mixer">
      <div class="mixer-heading"><h2>Audio</h2><span id="preview-label" hidden>Design preview</span></div>
      <div class="channels" id="channels"></div>
      <button id="apps-button" class="quiet apps-launch">App volumes</button>
    </aside>
  </main>
  <section id="execution" class="execution" aria-label="Running action" hidden>
    <div class="execution-copy"><strong id="execution-label"></strong><span id="execution-step" role="status" aria-live="polite"></span></div>
    <button id="cancel-action" class="danger">Cancel action</button>
  </section>
  <nav id="pages" class="pages" aria-label="Button pages"></nav>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="confirm-dialog" class="confirm-dialog"><form method="dialog"><h2 id="confirm-title">Confirm action</h2><p id="confirm-copy"></p><div class="dialog-actions"><button value="cancel" class="quiet">Cancel</button><button id="confirm-yes" value="confirm" class="primary">Confirm</button></div></form></dialog>
  <dialog id="panel" class="panel"><div class="panel-top"><h2 id="panel-title">Settings</h2><button id="close-panel" class="quiet" aria-label="Close settings">Close</button></div><div id="panel-body" class="panel-body"></div></dialog>
</body>
</html>
